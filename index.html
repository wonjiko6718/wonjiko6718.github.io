<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wonji Ko's Development Record</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    .layout {
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 24px;
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 40px;
      align-items: start;
    }

    /* 사이드바 */
    .sidebar {
      position: sticky;
      top: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
    }

    .profile-img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--border);
      background: var(--bg2);
    }

    .profile-avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: var(--accent-light);
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
    }

    .profile-name {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
    }

    .profile-bio {
      font-size: 13px;
      color: var(--text2);
      line-height: 1.6;
    }

    .profile-divider {
      width: 100%;
      height: 1px;
      background: var(--border);
    }

    .profile-links {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }

    .profile-link {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text2);
      padding: 6px 10px;
      border-radius: 6px;
      transition: background 0.15s, color 0.15s;
      text-decoration: none;
    }

    .profile-link:hover {
      background: var(--bg2);
      color: var(--accent);
      text-decoration: none;
    }

    .profile-link svg { flex-shrink: 0; }

    /* 게시판 목록 */
    .board-section {
      width: 100%;
      text-align: left;
    }

    .board-section-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
      padding-left: 4px;
    }

    .board-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      width: 100%;
    }

    .board-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 10px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--text2);
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      text-align: left;
    }

    .board-btn:hover {
      background: var(--bg2);
      color: var(--text);
    }

    .board-btn.active {
      background: var(--accent-light);
      color: var(--accent);
      font-weight: 600;
    }

    .board-btn .board-count {
      font-size: 11px;
      color: var(--text2);
      background: var(--bg2);
      padding: 1px 6px;
      border-radius: 10px;
    }

    .board-btn.active .board-count {
      background: var(--accent);
      color: #fff;
    }

    /* 헤더 */
    header nav { max-width: 1000px; }

    /* 검색 */
    .search-wrap {
      margin-bottom: 20px;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 12px 40px 12px 16px;
      font-size: 15px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg);
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
      font-family: inherit;
    }

    .search-input:focus { border-color: var(--accent); }

    .search-icon {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text2);
      font-size: 16px;
      pointer-events: none;
    }

    /* 게시판 헤더 */
    .board-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .board-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }

    .result-count {
      font-size: 13px;
      color: var(--text2);
    }

    .no-results {
      text-align: center;
      padding: 60px 0;
      color: var(--text2);
      font-size: 15px;
    }

    .post-categories {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    /* 카테고리 색상 */
    .cat-blue   { background: #e8f0fe; color: #1a73e8; }
    .cat-green  { background: #e6f4ea; color: #1e8e3e; }
    .cat-red    { background: #fce8e6; color: #d93025; }
    .cat-yellow { background: #fef7e0; color: #f29900; }
    .cat-purple { background: #f3e8fd; color: #9334e6; }
    .cat-gray   { background: #f1f3f4; color: #5f6368; }
    .cat-lime   { background: #f2fce4; color: #4caf11; }
    .cat-sky    { background: #e4f6fd; color: #0097c7; }

    @media (prefers-color-scheme: dark) {
      .cat-blue   { background: #1a2740; color: #8ab4f8; }
      .cat-green  { background: #1a2e1f; color: #81c995; }
      .cat-red    { background: #2e1a18; color: #f28b82; }
      .cat-yellow { background: #2e2510; color: #fdd663; }
      .cat-purple { background: #2a1a3e; color: #d7aefb; }
      .cat-gray   { background: #2e2e2e; color: #9aa0a6; }
      .cat-lime   { background: #1e2e10; color: #a8d878; }
      .cat-sky    { background: #102030; color: #67d0f5; }
    }

    mark {
      background: var(--accent-light);
      color: var(--accent);
      border-radius: 2px;
      padding: 0 2px;
    }

    .main-content { min-width: 0; }

    /* 페이지네이션 */
    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      margin-top: 24px;
    }

    .page-btn {
      min-width: 34px;
      height: 34px;
      padding: 0 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      font-family: inherit;
    }

    .page-btn:hover:not(:disabled) {
      background: var(--bg2);
      border-color: var(--accent);
      color: var(--accent);
    }

    .page-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      font-weight: 600;
    }

    .page-btn:disabled {
      opacity: 0.35;
      cursor: default;
    }

    /* 모바일 */
    @media (max-width: 640px) {
      .layout {
        grid-template-columns: 1fr;
        padding: 24px 16px;
      }
      .sidebar {
        position: static;
        flex-direction: row;
        text-align: left;
        flex-wrap: wrap;
        gap: 16px;
      }
      .profile-avatar, .profile-img {
        width: 64px;
        height: 64px;
        font-size: 28px;
        flex-shrink: 0;
      }
      .profile-links { flex-direction: row; flex-wrap: wrap; }
      .profile-divider { display: none; }
      .board-section { width: 100%; }
      .board-list { flex-direction: row; flex-wrap: wrap; gap: 6px; }
      .board-btn { width: auto; }
    }
  </style>
</head>
<body>

  <header>
    <nav>
      <a class="blog-title" href="https://wonjidev.com/">Wonji Ko's Development Record</a>
    </nav>
  </header>

  <div class="layout">

    <!-- 좌측 사이드바 -->
    <aside class="sidebar">
      <img
        class="profile-img"
        id="profile-img"
        src="/assets/images/profile.jpg"
        alt="프로필 사진"
        onerror="this.style.display='none'; document.getElementById('profile-avatar').style.display='flex';"
      >
      <div class="profile-avatar" id="profile-avatar" style="display:none;">👤</div>

      <div class="profile-name">Wonji Ko</div>
      <div class="profile-bio">
        Unreal Engine Developer<br>
        Graphics Simulation Engineer<br>
        AI Integrated Expert
      </div>

      <div class="profile-divider"></div>

      <div class="profile-links">
        <a class="profile-link" href="https://github.com/wonjiko6718" target="_blank" rel="noopener">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">

          </svg>
          GitHub
        </a>
        <a class="profile-link" href="https://git.wonjidev.com/WonjiKo" target="_blank" rel="noopener">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M15.876 13.396c-.272 1.181-1.449 1.964-2.644 1.746-1.314-.237-2.132-1.57-1.823-2.887.31-1.316 1.638-2.127 2.953-1.818 1.314.31 2.132 1.64 1.514 2.959zm-7.668.461c-.31 1.316-1.638 2.127-2.953 1.818C3.941 15.365 3.123 14.036 3.433 12.72c.31-1.317 1.638-2.128 2.953-1.819 1.314.31 2.132 1.64 1.822 2.956zM12 0C5.373 0 0 5.373 0 12c0 5.018 3.063 9.316 7.454 11.118-.103-.886-.197-2.247.041-3.213.216-.878 1.443-6.114 1.443-6.114s-.369-.737-.369-1.827c0-1.713.993-2.994 2.228-2.994 1.051 0 1.56.789 1.56 1.735 0 1.057-.674 2.641-1.022 4.108-.291 1.228.615 2.228 1.824 2.228 2.189 0 3.874-2.308 3.874-5.642 0-2.949-2.121-5.011-5.151-5.011-3.51 0-5.569 2.633-5.569 5.354 0 1.059.408 2.194 0.917 2.815.101.122.116.229.086.354-.094.388-.301 1.228-.342 1.4-.054.226-.181.274-.416.165-1.55-.722-2.521-2.99-2.521-4.814 0-3.917 2.846-7.514 8.208-7.514 4.308 0 7.655 3.07 7.655 7.172 0 4.278-2.697 7.719-6.44 7.719-1.258 0-2.441-.654-2.847-1.426l-.773 2.883c-.281 1.077-1.037 2.427-1.543 3.249C10.014 23.928 11 24 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0z"/>
          </svg>
        Gitea
        </a>
      </div>

      <div class="profile-divider"></div>

      <!-- 게시판 목록 (JS로 자동 생성) -->
      <div class="board-section">
        <div class="board-section-title">게시판</div>
        <div class="board-list" id="board-list"></div>
      </div>

    </aside>

    <!-- 우측 메인 -->
    <div class="main-content">
      <div class="search-wrap">
        <input
          class="search-input"
          id="search-input"
          type="text"
          placeholder="제목 또는 카테고리로 검색..."
          autocomplete="off"
        >
        <span class="search-icon">🔍</span>
      </div>

      <div class="board-header">
        <span class="board-title" id="board-title">전체 글</span>
        <span class="result-count" id="result-count"></span>
      </div>

      <ul class="post-list" id="post-list">
        <li class="loading">글 목록을 불러오는 중...</li>
      </ul>

      <div class="pagination" id="pagination"></div>
    </div>

  </div>

  <footer>
    <p>wonjidev.com</p>
  </footer>

  <script>
    const CATEGORY_COLORS = {
      'UnrealEngine':    'cat-blue',
      'AI':    'cat-green',
      'UnrealC++':    'cat-purple',
      'Common':    'cat-yellow',
      'Custom':    'cat-red',
      'Base':  'cat-gray',
      'Python':  'cat-lime',   
      'C++':    'cat-sky',   
    };

    const PAGE_SIZE = 10;

    let allPosts      = [];
    let filteredPosts = [];
    let boards        = [];
    let currentPage   = 1;
    let activeBoard   = null;  // null = 전체
    let searchQuery   = '';

    function getCategoryClass(name) {
      return CATEGORY_COLORS[name] || 'cat-gray';
    }

    function highlight(text, query) {
      if (!query) return text;
      const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      return text.replace(new RegExp(`(${escaped})`, 'gi'), '<mark>$1</mark>');
    }

    function getCategories(post) {
      return Array.isArray(post.category)
        ? post.category
        : (post.category ? [post.category] : []);
    }

    function renderCategories(categories, query) {
      if (categories.length === 0) return '';
      return `<span class="post-categories">
        ${categories.map(c =>
          `<span class="post-category ${getCategoryClass(c)}">${highlight(c, query)}</span>`
        ).join('')}
      </span>`;
    }

    /* 게시판 버튼 생성 */
    function buildBoardButtons() {
      const wrap = document.getElementById('board-list');
      wrap.innerHTML = '';

      // 전체 버튼
      const allCount = allPosts.length;
      const allBtn = document.createElement('button');
      allBtn.className = 'board-btn' + (activeBoard === null ? ' active' : '');
      allBtn.innerHTML = `<span>전체</span><span class="board-count">${allCount}</span>`;
      allBtn.onclick = () => selectBoard(null);
      wrap.appendChild(allBtn);

      // 폴더별 버튼
      boards.forEach(board => {
        const count = allPosts.filter(p => p.board === board).length;
        const btn = document.createElement('button');
        btn.className = 'board-btn' + (activeBoard === board ? ' active' : '');
        btn.innerHTML = `<span>${board}</span><span class="board-count">${count}</span>`;
        btn.onclick = () => selectBoard(board);
        wrap.appendChild(btn);
      });
    }

    function selectBoard(board) {
      activeBoard = board;
      currentPage = 1;
      document.getElementById('board-title').textContent = board || '전체 글';
      applyFilters();
      buildBoardButtons();
    }

    /* 필터 적용 */
    function applyFilters() {
      const q = searchQuery.trim().toLowerCase();

      filteredPosts = allPosts.filter(post => {
        // 게시판 필터
        if (activeBoard && post.board !== activeBoard) return false;

        // 검색어 필터
        if (q) {
          const cats    = getCategories(post);
          const inTitle = post.title.toLowerCase().includes(q);
          const inCat   = cats.some(c => c.toLowerCase().includes(q));
          if (!inTitle && !inCat) return false;
        }

        return true;
      });

      currentPage = 1;
      renderPage();
    }

    /* 현재 페이지 렌더링 */
    function renderPage() {
      const list    = document.getElementById('post-list');
      const countEl = document.getElementById('result-count');
      const q       = searchQuery.trim();

      if (filteredPosts.length === 0) {
        list.innerHTML = `<li class="no-results">게시물이 없습니다.</li>`;
        countEl.textContent = '';
        renderPagination(0);
        return;
      }

      const total      = filteredPosts.length;
      const totalPages = Math.ceil(total / PAGE_SIZE);
      const start      = (currentPage - 1) * PAGE_SIZE;
      const pagePosts  = filteredPosts.slice(start, start + PAGE_SIZE);

      countEl.textContent = `${total}개`;

      list.innerHTML = pagePosts.map(post => `
        <li class="post-item">
          <a class="post-link" href="/post.html?id=${encodeURIComponent(post.id)}">
            <span class="post-title">${highlight(post.title, q)}</span>
            <span class="post-meta">
              ${renderCategories(getCategories(post), q)}
              <span class="post-date">${post.date}</span>
            </span>
          </a>
        </li>
      `).join('');

      renderPagination(totalPages);
    }

    /* 페이지네이션 */
    function renderPagination(totalPages) {
      const wrap = document.getElementById('pagination');
      if (totalPages <= 1) { wrap.innerHTML = ''; return; }

      let html = '';
      html += `<button class="page-btn" onclick="goPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>‹</button>`;

      for (let i = 1; i <= totalPages; i++) {
        if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
          html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`;
        } else if (i === currentPage - 3 || i === currentPage + 3) {
          html += `<button class="page-btn" disabled>…</button>`;
        }
      }

      html += `<button class="page-btn" onclick="goPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>›</button>`;
      wrap.innerHTML = html;
    }

    function goPage(page) {
      currentPage = page;
      renderPage();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function loadPosts() {
      const list = document.getElementById('post-list');
      try {
        const res = await fetch('/posts/list.json');
        if (!res.ok) throw new Error('list.json을 찾을 수 없습니다.');
        const data = await res.json();

        // 이전 형식(배열) 하위 호환 처리
        if (Array.isArray(data)) {
          allPosts = data;
          boards   = [...new Set(data.map(p => p.board).filter(Boolean))];
        } else {
          allPosts = data.posts  || [];
          boards   = data.boards || [];
        }

        filteredPosts = [...allPosts];
        buildBoardButtons();
        renderPage();

        // URL 검색어 자동 적용
        const params = new URLSearchParams(window.location.search);
        const q = params.get('q');
        if (q) {
          document.getElementById('search-input').value = q;
          searchQuery = q;
          applyFilters();
        }
      } catch (e) {
        list.innerHTML = `<li style="padding:20px"><div class="error-msg">오류: ${e.message}</div></li>`;
      }
    }

    document.getElementById('search-input').addEventListener('input', e => {
      searchQuery = e.target.value;
      applyFilters();
    });

    loadPosts();
  </script>

</body>
</html>
