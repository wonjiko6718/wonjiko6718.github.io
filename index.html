<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wonji Ko's Development Record</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    .search-wrap {
      margin-bottom: 20px;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 12px 40px 12px 16px;
      font-size: 15px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg);
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
      font-family: inherit;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .search-icon {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text2);
      font-size: 16px;
      pointer-events: none;
    }

    .search-result-count {
      font-size: 13px;
      color: var(--text2);
      margin-bottom: 12px;
    }

    .no-results {
      text-align: center;
      padding: 60px 0;
      color: var(--text2);
      font-size: 15px;
    }

    /* 카테고리 여러 개 나란히 */
    .post-categories {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    mark {
      background: var(--accent-light);
      color: var(--accent);
      border-radius: 2px;
      padding: 0 2px;
    }
  </style>
</head>
<body>

  <header>
    <nav>
      <a class="blog-title" href="/">Wonji Ko's Development Record</a>
    </nav>
  </header>

  <main>
    <div class="search-wrap">
      <input
        class="search-input"
        id="search-input"
        type="text"
        placeholder="제목 또는 카테고리로 검색..."
        autocomplete="off"
      >
      <span class="search-icon">🔍</span>
    </div>

    <div class="search-result-count" id="result-count"></div>

    <ul class="post-list" id="post-list">
      <li class="loading">글 목록을 불러오는 중...</li>
    </ul>
  </main>

  <footer>
    <p>wonjiko6718.github.io</p>
  </footer>

  <script>
    let allPosts = [];

    function highlight(text, query) {
      if (!query) return text;
      const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      return text.replace(new RegExp(`(${escaped})`, 'gi'), '<mark>$1</mark>');
    }

    function renderCategories(categories, query) {
      // categories가 문자열이면 배열로 변환 (하위 호환)
      const list = Array.isArray(categories)
        ? categories
        : (categories ? [categories] : []);

      if (list.length === 0) return '';
      return `<span class="post-categories">
        ${list.map(c => `<span class="post-category">${highlight(c, query)}</span>`).join('')}
      </span>`;
    }

    function renderPosts(posts, query = '') {
      const list = document.getElementById('post-list');
      const countEl = document.getElementById('result-count');

      if (posts.length === 0) {
        list.innerHTML = `<li class="no-results">검색 결과가 없습니다.</li>`;
        countEl.textContent = query ? `"${query}" 검색 결과 0개` : '';
        return;
      }

      countEl.textContent = query
        ? `"${query}" 검색 결과 ${posts.length}개`
        : `전체 ${posts.length}개`;

      list.innerHTML = posts.map(post => `
        <li class="post-item">
          <a class="post-link" href="/post.html?id=${post.id}">
            <span class="post-title">${highlight(post.title, query)}</span>
            <span class="post-meta">
              ${renderCategories(post.category, query)}
              <span class="post-date">${post.date}</span>
            </span>
          </a>
        </li>
      `).join('');
    }

    function filterPosts(query) {
      if (!query.trim()) {
        renderPosts(allPosts, '');
        return;
      }
      const q = query.trim().toLowerCase();
      const filtered = allPosts.filter(post => {
        // 제목 검색
        if (post.title.toLowerCase().includes(q)) return true;
        // 카테고리 검색 (배열 또는 문자열 모두 처리)
        const categories = Array.isArray(post.category)
          ? post.category
          : (post.category ? [post.category] : []);
        return categories.some(c => c.toLowerCase().includes(q));
      });
      renderPosts(filtered, query.trim());
    }

    async function loadPosts() {
      const list = document.getElementById('post-list');
      try {
        const res = await fetch('/posts/list.json');
        if (!res.ok) throw new Error('list.json을 찾을 수 없습니다.');
        allPosts = await res.json();
        renderPosts(allPosts);

        // URL에 검색어가 있으면 자동 적용 (?q=검색어)
        const params = new URLSearchParams(window.location.search);
        const q = params.get('q');
        if (q) {
          document.getElementById('search-input').value = q;
          filterPosts(q);
        }
      } catch (e) {
        list.innerHTML = `<li style="padding:20px"><div class="error-msg">오류: ${e.message}</div></li>`;
      }
    }

    document.getElementById('search-input').addEventListener('input', e => {
      filterPosts(e.target.value);
    });

    loadPosts();
  </script>

</body>
</html>
